
{% extends 'base.html' %}

{% block title %}Supprimer facture{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h4>Confirmation</h4>
            </div>
            <div class="card-body text-center">
                <p>Supprimer la facture <strong>{{ facture.numero }}</strong> ?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Oui</button>
                    <a href="{% url 'factures:detail' facture.pk %}" class="btn btn-secondary">Non</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
